server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: zelo-api
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    username: ${DB_USERNAME:ZELO}
    password: ${DB_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
  jackson:
    time-zone: America/Sao_Paulo

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    origins: ${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  jwt:
    # Troque por uma chave aleatória com pelo menos 32 caracteres.
    secret: ${JWT_SECRET:ZeloProjetoLocalDevSecretKey2026ChangeMe}
    expiration-ms: 86400000

logging:
  level:
    br.com.zelo: INFO
